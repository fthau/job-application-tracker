{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card error-card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
